<svg width="700" height="440" viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyfd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ebee"/>
      <stop offset="1" stop-color="#cfd3d8"/>
    </linearGradient>
  </defs>
  <rect width="700" height="440" fill="url(#skyfd)"/>
  <ellipse cx="350" cy="400" rx="320" ry="26" fill="#00000014"/>

  <!-- crates stack -->
  <g transform="translate(60,190)">
    <g transform="translate(0,60)">
      <rect width="90" height="70" rx="4" fill="#dcbd8f" stroke="#a9814f" stroke-width="3"/>
      <line x1="0" y1="20" x2="90" y2="20" stroke="#a9814f" stroke-width="3"/>
      <line x1="0" y1="45" x2="90" y2="45" stroke="#a9814f" stroke-width="3"/>
    </g>
    <g transform="translate(95,90)">
      <rect width="80" height="55" rx="4" fill="#e7cea5" stroke="#a9814f" stroke-width="3"/>
      <line x1="0" y1="18" x2="80" y2="18" stroke="#a9814f" stroke-width="2.5"/>
      <line x1="0" y1="38" x2="80" y2="38" stroke="#a9814f" stroke-width="2.5"/>
    </g>
    <g transform="translate(10,0)">
      <rect width="80" height="60" rx="4" fill="#e7cea5" stroke="#a9814f" stroke-width="3"/>
      <circle cx="20" cy="25" r="9" fill="#F4791E"/>
      <circle cx="42" cy="20" r="10" fill="#e2591a"/>
      <circle cx="63" cy="27" r="8" fill="#F4791E"/>
      <circle cx="30" cy="38" r="8" fill="#e2591a"/>
      <circle cx="52" cy="40" r="9" fill="#F4791E"/>
    </g>
  </g>

  <!-- truck -->
  <g transform="translate(230,120)">
    <!-- cargo box -->
    <rect x="0" y="20" width="300" height="170" rx="10" fill="#F4791E"/>
    <rect x="14" y="34" width="272" height="60" rx="6" fill="#ffffff" opacity="0.16"/>
    <!-- leaf emblem -->
    <g transform="translate(140,70)" fill="#ffffff" opacity="0.9">
      <path d="M0 30 C -10 0 20 -20 45 -18 C 40 8 20 30 0 30 Z"/>
    </g>
    <!-- cabin -->
    <path d="M300 190 L300 90 L345 90 C 360 90 372 100 378 114 L392 150 L392 190 Z" fill="#e2591a"/>
    <rect x="313" y="103" width="55" height="38" rx="6" fill="#cfe7f2" opacity="0.85"/>
    <!-- wheels -->
    <circle cx="60" cy="196" r="28" fill="#2b2b2b"/>
    <circle cx="60" cy="196" r="11" fill="#c8c8c8"/>
    <circle cx="330" cy="196" r="28" fill="#2b2b2b"/>
    <circle cx="330" cy="196" r="11" fill="#c8c8c8"/>
    <!-- bumper line -->
    <rect x="0" y="188" width="392" height="8" fill="#00000022"/>
  </g>
</svg>
