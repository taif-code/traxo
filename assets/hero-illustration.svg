<svg width="560" height="480" viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg">
  <!-- back gray card -->
  <rect x="120" y="70" width="330" height="330" rx="28" fill="#9a9a9a" opacity="0.55"/>
  <!-- dark map card -->
  <rect x="170" y="110" width="360" height="300" rx="28" fill="#B5551D"/>
  <g opacity="0.35" stroke="#ffffff" stroke-width="2">
    <path d="M170 180 L530 160"/>
    <path d="M170 240 L530 260"/>
    <path d="M170 300 L530 320"/>
    <path d="M230 110 L210 410"/>
    <path d="M330 110 L340 410"/>
    <path d="M430 110 L450 410"/>
  </g>
  <!-- route dashed line -->
  <path d="M230 360 C 280 300, 320 260, 300 220 C 285 195, 320 190, 350 165" stroke="#ffffff" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- location pin -->
  <g transform="translate(300,175)">
    <circle cx="0" cy="70" r="46" fill="#F4791E" opacity="0.18"/>
    <path d="M0 -35 C 24 -35 40 -17 40 6 C 40 34 12 62 0 78 C -12 62 -40 34 -40 6 C -40 -17 -24 -35 0 -35 Z" fill="#F4791E"/>
    <circle cx="0" cy="4" r="14" fill="#fff"/>
  </g>
  <!-- small pins -->
  <circle cx="205" cy="150" r="7" fill="#fff"/>
  <circle cx="490" cy="145" r="7" fill="#fff"/>
  <circle cx="480" cy="370" r="7" fill="#fff"/>
  <circle cx="200" cy="380" r="7" fill="#fff"/>

  <!-- front orange card: crate / produce app -->
  <rect x="10" y="150" width="270" height="270" rx="26" fill="#F4791E"/>
  <g transform="translate(45,185)">
    <!-- phone -->
    <rect x="20" y="0" width="130" height="200" rx="18" fill="#FCEFE3" stroke="#fff" stroke-width="3"/>
    <rect x="34" y="18" width="102" height="120" rx="6" fill="#ffffff" opacity="0.7"/>
    <!-- crate icon on phone -->
    <g transform="translate(58,45)">
      <rect x="0" y="18" width="54" height="34" rx="3" fill="#F4791E"/>
      <path d="M0 18 L27 2 L54 18" fill="none" stroke="#B5551D" stroke-width="3" stroke-linejoin="round"/>
      <line x1="10" y1="24" x2="10" y2="52" stroke="#B5551D" stroke-width="2"/>
      <line x1="44" y1="24" x2="44" y2="52" stroke="#B5551D" stroke-width="2"/>
    </g>
    <rect x="34" y="150" width="102" height="14" rx="7" fill="#F4791E" opacity="0.85"/>
    <rect x="34" y="172" width="70" height="10" rx="5" fill="#e9c3a5"/>
    <!-- hand holding produce crate, simplified -->
    <g transform="translate(-30,90)">
      <ellipse cx="30" cy="70" rx="46" ry="14" fill="#B5551D" opacity="0.25"/>
      <rect x="0" y="20" width="60" height="42" rx="4" fill="#fff" stroke="#F4791E" stroke-width="3"/>
      <line x1="10" y1="26" x2="10" y2="56" stroke="#F4791E" stroke-width="2"/>
      <line x1="50" y1="26" x2="50" y2="56" stroke="#F4791E" stroke-width="2"/>
      <circle cx="20" cy="14" r="7" fill="#8FBF5C"/>
      <circle cx="34" cy="10" r="8" fill="#8FBF5C"/>
      <circle cx="46" cy="16" r="6" fill="#8FBF5C"/>
    </g>
  </g>
</svg>
