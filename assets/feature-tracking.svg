<svg width="700" height="440" viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2436"/>
      <stop offset="1" stop-color="#132a3d"/>
    </linearGradient>
  </defs>
  <rect width="700" height="440" fill="url(#nightbg)"/>

  <!-- glow -->
  <circle cx="420" cy="150" r="150" fill="#F4791E" opacity="0.10"/>

  <!-- dotted route -->
  <path d="M120 380 C 220 340 260 260 340 220 C 400 190 420 150 470 100" stroke="#F4B36B" stroke-width="3" stroke-dasharray="1 12" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- hand / arm silhouette -->
  <path d="M40 440 C 60 360 110 330 165 300 L 230 250 C 245 238 268 240 278 258 C 288 276 280 296 262 306 L 205 340 L 200 440 Z" fill="#c98a5b"/>

  <!-- phone -->
  <g transform="translate(150,150) rotate(-12)">
    <rect x="0" y="0" width="150" height="230" rx="20" fill="#0b1622" stroke="#3a5266" stroke-width="4"/>
    <rect x="10" y="14" width="130" height="202" rx="10" fill="#0e2032"/>
    <!-- map dots -->
    <g fill="#F4B36B" opacity="0.5">
      <circle cx="30" cy="40" r="2"/><circle cx="55" cy="35" r="2"/><circle cx="80" cy="45" r="2"/>
      <circle cx="105" cy="38" r="2"/><circle cx="40" cy="70" r="2"/><circle cx="70" cy="80" r="2"/>
      <circle cx="100" cy="72" r="2"/><circle cx="120" cy="90" r="2"/><circle cx="30" cy="110" r="2"/>
      <circle cx="60" cy="120" r="2"/><circle cx="95" cy="115" r="2"/>
    </g>
    <!-- car icons -->
    <g transform="translate(35,60)">
      <rect width="26" height="16" rx="4" fill="#F4791E"/>
      <circle cx="6" cy="16" r="3" fill="#0e2032"/>
      <circle cx="20" cy="16" r="3" fill="#0e2032"/>
    </g>
    <g transform="translate(75,95)">
      <rect width="22" height="14" rx="4" fill="#ffb35c"/>
      <circle cx="5" cy="14" r="2.5" fill="#0e2032"/>
      <circle cx="17" cy="14" r="2.5" fill="#0e2032"/>
    </g>
    <g transform="translate(45,140)">
      <rect width="24" height="15" rx="4" fill="#F4791E"/>
      <circle cx="6" cy="15" r="3" fill="#0e2032"/>
      <circle cx="18" cy="15" r="3" fill="#0e2032"/>
    </g>
    <rect x="20" y="180" width="110" height="16" rx="8" fill="#F4791E"/>
  </g>

  <!-- destination card top right -->
  <g transform="translate(430,60)">
    <rect width="150" height="60" rx="14" fill="#0e2032" stroke="#F4791E" stroke-width="2"/>
    <circle cx="30" cy="30" r="14" fill="#F4791E" opacity="0.25"/>
    <path d="M30 18 C 37 18 42 24 42 30 C 42 37 32 46 30 48 C 28 46 18 37 18 30 C 18 24 23 18 30 18 Z" fill="#F4791E"/>
    <rect x="60" y="18" width="70" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="60" y="34" width="50" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
